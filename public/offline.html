<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F4" />
    <title>Dukhata — offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(120% 90% at 80% 0%, #ffffff 0%, #faf8f4 45%, #f3efe8 100%);
        color: #1c1917;
        font-family: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fffdfa;
        border: 1px solid #ece8e2;
        border-radius: 20px;
        padding: 28px 24px 26px;
        text-align: center;
        box-shadow: 0 18px 40px -24px rgba(28, 25, 23, 0.35);
      }
      .mark { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 16px 0 6px; font-size: 20px; letter-spacing: -0.02em; }
      p { margin: 0; color: #78716c; font-size: 14.5px; line-height: 1.6; }
      .ur { margin-top: 10px; direction: rtl; font-size: 15px; }
      button {
        margin-top: 22px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 12px;
        background: #292524;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { background: #0c0a09; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/icon-192.png" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>
        Dukhata needs an internet connection to keep your khata in sync.
        Check your data or Wi-Fi, then try again.
      </p>
      <p class="ur" lang="ur" dir="rtl">
        انٹرنیٹ کنیکشن نہیں ہے۔ اپنا ڈیٹا یا وائی فائی چیک کر کے دوبارہ کوشش کریں — آپ کا کھاتہ محفوظ ہے۔
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
